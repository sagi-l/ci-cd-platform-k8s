replicas: 1
minimumMasterNodes: 1

resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "1000m"
    memory: "4Gi"

volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi

esConfig:
  elasticsearch.yml: |
    cluster.name: "logging-stack"
