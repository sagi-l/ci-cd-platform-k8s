apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ci-dashboard-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sagi-l/ci-dashboard.git
    targetRevision: dev
    path: k8s/app-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ci-dashboard-dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
